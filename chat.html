<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天</title>
    <style>
      :root {
        --bg: #f2f2f7;
        --panel: #ffffff;
        --text: #111111;
        --secondary: #8e8e93;
        --bubble-in: #ffffff;
        --bubble-out: #34b7f1;
        --accent: #34b7f1;
        --border: #e3e3e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      .chat {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .chat-header {
        flex: 0 0 62px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(12px);
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e7e7ee;
        flex: 0 0 38px;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }

      .header-text {
        flex: 1;
        min-width: 0;
      }

      .chat-title {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }

      .chat-subtitle {
        margin-top: 2px;
        font-size: 12px;
        color: var(--secondary);
      }

      .icon-button {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: #555555;
        font-size: 18px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .icon-button:hover {
        background: rgba(0, 0, 0, 0.06);
      }

      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 18px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .messages::-webkit-scrollbar {
        width: 6px;
      }

      .messages::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.14);
        border-radius: 999px;
      }

      .hint {
        margin: auto;
        color: #9a9aa3;
        font-size: 13px;
      }

      .message {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .message .avatar {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
        font-size: 12px;
        color: #666666;
      }

      .bubble {
        max-width: 72%;
        padding: 10px 13px;
        border-radius: 18px;
        font-size: 15px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      .message.pet .bubble {
        background: var(--bubble-in);
        color: var(--text);
        border-bottom-left-radius: 6px;
      }

      .message.user .bubble {
        background: var(--bubble-out);
        color: #ffffff;
        border-bottom-right-radius: 6px;
      }

      .message.pet .bubble.typing {
        min-width: 18px;
      }

      .message.pet .bubble.typing::after {
        content: '▍';
        margin-left: 2px;
        animation: blink 0.8s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .system-message {
        margin: 4px auto;
        padding: 5px 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.05);
        color: #7b7b82;
        font-size: 12px;
        text-align: center;
      }

      .composer {
        flex: 0 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 10px 12px 12px;
        background: rgba(255, 255, 255, 0.96);
        border-top: 1px solid var(--border);
      }

      #input {
        flex: 1;
        min-height: 40px;
        max-height: 112px;
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 20px;
        background: #f2f2f7;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        line-height: 1.4;
        resize: none;
        outline: none;
      }

      #input:focus {
        border-color: rgba(52, 183, 241, 0.35);
        background: #ffffff;
      }

      #send {
        flex: 0 0 auto;
        height: 40px;
        padding: 0 18px;
        border: none;
        border-radius: 20px;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      #send:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .settings-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.28);
      }

      .settings-backdrop.open {
        display: flex;
      }

      .settings-panel {
        width: 320px;
        max-width: 100%;
        padding: 18px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
      }

      .settings-title {
        margin-bottom: 10px;
        font-size: 17px;
        font-weight: 700;
      }

      .settings-notice {
        min-height: 18px;
        margin-bottom: 8px;
        color: #d9534f;
        font-size: 13px;
      }

      .field-label {
        display: block;
        margin: 10px 0 6px;
        color: #555555;
        font-size: 13px;
      }

      .settings-panel input {
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid #d9d9de;
        border-radius: 10px;
        background: #fafafa;
        color: #111111;
        font: inherit;
        font-size: 14px;
        outline: none;
      }

      .settings-panel input:focus {
        border-color: rgba(52, 183, 241, 0.65);
        background: #ffffff;
      }

      .field-hint {
        margin-top: 6px;
        color: #999999;
        font-size: 12px;
      }

      .settings-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      .settings-actions button {
        height: 36px;
        padding: 0 16px;
        border: none;
        border-radius: 18px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .secondary-button {
        background: #f0f0f2;
        color: #444444;
      }

      .primary-button {
        background: var(--accent);
        color: #ffffff;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <div class="chat">
      <header class="chat-header">
        <div class="avatar">
          <img src="./assets/scratch_01.png" alt="小恐龙" />
        </div>
        <div class="header-text">
          <div class="chat-title">小恐龙</div>
          <div class="chat-subtitle">DeepSeek 在线</div>
        </div>
        <button class="icon-button" id="settingsButton" title="设置">⚙</button>
      </header>

      <main class="messages" id="messages">
        <div class="hint" id="hint">和小恐龙聊聊天吧</div>
      </main>

      <footer class="composer">
        <textarea id="input" rows="1" placeholder="发消息..."></textarea>
        <button id="send">发送</button>
      </footer>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop">
      <div class="settings-panel">
        <div class="settings-title">DeepSeek 设置</div>
        <div class="settings-notice" id="settingsNotice"></div>

        <label class="field-label" for="apiKeyInput">API Key</label>
        <input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-..." />
        <div class="field-hint">API Key 只会保存在本机，不会提交到 Git。</div>

        <label class="field-label" for="modelInput">模型名称</label>
        <input id="modelInput" type="text" placeholder="deepseek-v4-flash" />

        <label class="field-label" for="baseUrlInput">接口地址</label>
        <input id="baseUrlInput" type="text" placeholder="https://api.deepseek.com" />

        <div class="settings-actions">
          <button class="secondary-button" id="cancelSettings">取消</button>
          <button class="primary-button" id="saveSettings">保存</button>
        </div>
      </div>
    </div>

    <script>
      const messages = document.getElementById('messages');
      const input = document.getElementById('input');
      const sendButton = document.getElementById('send');
      const hint = document.getElementById('hint');
      const settingsBackdrop = document.getElementById('settingsBackdrop');
      const settingsNotice = document.getElementById('settingsNotice');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const modelInput = document.getElementById('modelInput');
      const baseUrlInput = document.getElementById('baseUrlInput');
      const settingsButton = document.getElementById('settingsButton');
      const saveSettingsButton = document.getElementById('saveSettings');
      const cancelSettingsButton = document.getElementById('cancelSettings');

      let waitingReply = false;
      let typingTimer = null;

      function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
      }

      function removeHint() {
        if (hint) {
          hint.remove();
        }
      }

      function createMessage(text, type) {
        const row = document.createElement('div');
        row.className = `message ${type}`;

        if (type === 'pet') {
          row.innerHTML = `
            <div class="avatar"><img src="./assets/scratch_01.png" alt="" /></div>
            <div class="bubble"></div>
          `;
        } else {
          row.innerHTML = `
            <div class="bubble"></div>
            <div class="avatar">我</div>
          `;
        }

        const bubble = row.querySelector('.bubble');
        bubble.textContent = text;
        messages.appendChild(row);
        scrollToBottom();
        return bubble;
      }

      function createSystemMessage(text) {
        const row = document.createElement('div');
        row.className = 'system-message';
        row.textContent = text;
        messages.appendChild(row);
        scrollToBottom();
      }

      function openSettings(notice) {
        if (notice) {
          settingsNotice.textContent = notice;
        }

        settingsBackdrop.classList.add('open');
        setTimeout(() => apiKeyInput.focus(), 0);
      }

      function closeSettings() {
        settingsBackdrop.classList.remove('open');
      }

      async function typeReply(content) {
        const bubble = createMessage('', 'pet');
        bubble.classList.add('typing');
        const characters = Array.from(content);
        let index = 0;

        return new Promise((resolve) => {
          typingTimer = setInterval(() => {
            bubble.textContent = characters.slice(0, index + 1).join('');
            index += 1;
            scrollToBottom();

            if (index >= characters.length) {
              clearInterval(typingTimer);
              typingTimer = null;
              bubble.classList.remove('typing');
              resolve();
            }
          }, 35);
        });
      }

      function autoResizeInput() {
        input.style.height = 'auto';
        input.style.height = `${Math.min(input.scrollHeight, 112)}px`;
      }

      async function sendMessage() {
        const text = input.value.trim();

        if (!text || waitingReply) {
          return;
        }

        removeHint();
        createMessage(text, 'user');
        input.value = '';
        autoResizeInput();

        waitingReply = true;
        sendButton.disabled = true;

        try {
          const result = await window.chatAPI.sendMessage(text);

          if (result.ok) {
            await typeReply(result.content);
          } else if (result.code === 'MISSING_API_KEY') {
            openSettings('请先填写 DeepSeek API Key');
          } else {
            createSystemMessage(result.message || '请求失败，请稍后再试');
          }
        } catch (error) {
          createSystemMessage('请求失败，请检查网络和配置');
        } finally {
          waitingReply = false;
          sendButton.disabled = false;
          input.focus();
        }
      }

      async function loadConfig() {
        try {
          const config = await window.chatAPI.getConfig();
          apiKeyInput.value = config.apiKey || '';
          modelInput.value = config.model || 'deepseek-v4-flash';
          baseUrlInput.value = config.baseUrl || 'https://api.deepseek.com';

          if (!config.apiKey) {
            openSettings('请先填写 DeepSeek API Key');
          }
        } catch (error) {
          openSettings('无法读取本地配置，请检查后重试');
        }
      }

      async function saveSettings() {
        const apiKey = apiKeyInput.value.trim();
        const model = modelInput.value.trim();
        const baseUrl = baseUrlInput.value.trim();

        if (!apiKey) {
          settingsNotice.textContent = 'API Key 不能为空';
          apiKeyInput.focus();
          return;
        }

        const result = await window.chatAPI.saveConfig({
          apiKey,
          model,
          baseUrl
        });

        if (result.ok) {
          closeSettings();
        } else {
          settingsNotice.textContent = result.message || '保存失败，请重试';
        }
      }

      sendButton.addEventListener('click', sendMessage);

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      input.addEventListener('input', autoResizeInput);

      settingsButton.addEventListener('click', () => {
        settingsNotice.textContent = '';
        openSettings();
      });

      cancelSettingsButton.addEventListener('click', closeSettings);
      saveSettingsButton.addEventListener('click', saveSettings);

      loadConfig();
      input.focus();
    </script>
  </body>
</html>
