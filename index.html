<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JUJU 桌宠演示</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        font-family: system-ui, sans-serif;
        background: #10131a;
      }
      main { width: min(100%, 1000px); text-align: center; }
      h1 { margin: 0 0 18px; font-size: clamp(24px, 5vw, 40px); }
      video {
        display: block;
        width: 100%;
        max-height: 75vh;
        border-radius: 14px;
        background: #000;
        box-shadow: 0 16px 50px #0008;
      }
      p { color: #cbd5e1; }
      a { color: #7dd3fc; }
    </style>
  </head>
  <body>
    <main>
      <h1>JUJU 桌宠演示</h1>
      <video controls autoplay muted playsinline>
        <source src="./宠物视频.mp4" type="video/mp4" />
        你的浏览器不支持播放视频。
      </video>
      <p><a href="https://github.com/zuolan17/zhuochong">查看源码和使用说明</a></p>
    </main>
  </body>
</html>
